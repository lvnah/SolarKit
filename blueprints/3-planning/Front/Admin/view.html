<!-- SolarKit · fragment SPA — injecté dans #app par $router.go('admin') -->
<div class="space-y-8">

  <div class="flex flex-wrap items-end justify-between gap-4">
    <div>
      <h1 class="text-2xl font-bold">Administration du planning</h1>
      <p class="text-sm text-slate-500">Connecté en tant que <span class="font-semibold text-slate-700" id="who"></span>.</p>
    </div>
    <a href="Back/visualdata.php" target="_blank" rel="noopener" class="sk-btn-ghost">
      Explorateur de base de données ↗
    </a>
  </div>

  <div id="stats" class="grid gap-4 sm:grid-cols-2 lg:grid-cols-4"></div>

  <!-- Affectation rapide -->
  <section class="sk-card space-y-4">
    <div>
      <h2 class="text-lg font-bold">Affecter un créneau</h2>
      <p class="text-sm text-slate-500">Raccourci : écrit directement dans la table <code>shifts</code>.</p>
    </div>
    <form id="assign" class="grid gap-3 sm:grid-cols-3 lg:grid-cols-6">
      <select id="a-emp" class="sk-input lg:col-span-2" required></select>
      <input id="a-day" type="date" class="sk-input" required>
      <input id="a-start" type="time" value="08:00" class="sk-input" required>
      <input id="a-end" type="time" value="17:00" class="sk-input" required>
      <select id="a-kind" class="sk-input"></select>
      <input id="a-site" class="sk-input sm:col-span-2 lg:col-span-5" placeholder="Chantier / lieu">
      <button type="submit" class="sk-btn">Ajouter</button>
    </form>
    <p id="a-msg" class="text-sm font-medium"></p>
  </section>

  <!-- Charge par employé sur la semaine en cours -->
  <section class="sk-card space-y-3">
    <div class="flex items-center justify-between">
      <h2 class="text-lg font-bold">Charge de la semaine en cours</h2>
      <span id="week-label" class="text-xs text-slate-400"></span>
    </div>
    <div id="load"></div>
  </section>

  <div id="employees"></div>
  <div id="shifts"></div>
  <div id="users"></div>

  <div class="sk-card max-w-xl space-y-4">
    <div>
      <h2 class="text-lg font-bold">Mon mot de passe</h2>
      <p class="text-sm text-slate-500">Remplacez le mot de passe <code>admin</code> par défaut.</p>
    </div>
    <form id="pw-form" class="space-y-3">
      <div class="space-y-1">
        <label for="pw-cur" class="block text-xs font-semibold uppercase tracking-wide text-slate-500">Mot de passe actuel</label>
        <input id="pw-cur" name="current" type="password" class="sk-input" autocomplete="current-password" required>
      </div>
      <div class="space-y-1">
        <label for="pw-new" class="block text-xs font-semibold uppercase tracking-wide text-slate-500">Nouveau mot de passe</label>
        <input id="pw-new" name="password" type="password" class="sk-input" autocomplete="new-password" minlength="3" required>
      </div>
      <div class="flex items-center gap-3">
        <button type="submit" class="sk-btn">Mettre à jour</button>
        <span id="pw-msg" class="text-sm font-medium"></span>
      </div>
    </form>
  </div>

</div>

<script>
  const root = $page.root;
  root.querySelector('#who').textContent = $auth.user.username + ' (' + $auth.user.role + ')';

  let team = [];
  let shifts = [];

  const employeesCrud = $ui.crud('#employees', 'employees', {
    title: 'Équipe',
    columns: ['name', 'role', 'email', 'phone', 'weekly_hours', 'active'],
    onChange: () => refresh()
  });

  const shiftsCrud = $ui.crud('#shifts', 'shifts', {
    title: 'Créneaux',
    columns: ['employee_id', 'day', 'start_at', 'end_at', 'site', 'kind'],
    order: 'day desc',
    onChange: () => refresh()
  });

  $ui.crud('#users', '_users', { title: 'Comptes utilisateurs', columns: ['username', 'role'] });

  function iso(date) {
    const m = String(date.getMonth() + 1).padStart(2, '0');
    const d = String(date.getDate()).padStart(2, '0');
    return date.getFullYear() + '-' + m + '-' + d;
  }
  function mondayOf(date) {
    const d = new Date(date.getFullYear(), date.getMonth(), date.getDate());
    d.setDate(d.getDate() - ((d.getDay() + 6) % 7));
    return d;
  }
  function addDays(date, n) {
    const d = new Date(date.getTime());
    d.setDate(d.getDate() + n);
    return d;
  }
  function minutes(time) {
    const p = String(time || '00:00').split(':');
    return Number(p[0] || 0) * 60 + Number(p[1] || 0);
  }

  async function refresh() {
    const res = await Promise.all([
      $db.list('employees', { order: 'name asc', limit: 500 }),
      $db.list('shifts', { order: 'day asc', limit: 1000 })
    ]);
    team = res[0];
    shifts = res[1];
    renderStats();
    renderPickers();
    renderLoad();
  }

  function renderStats() {
    const active = team.filter((e) => Number(e.active));
    const future = shifts.filter((s) => s.day >= iso(new Date()));
    const card = (label, value, tone) =>
      '<div class="sk-card"><p class="text-xs font-semibold uppercase tracking-wide text-slate-400">' + label + '</p>' +
      '<p class="mt-1 text-3xl font-black ' + (tone || 'text-slate-900') + '">' + value + '</p></div>';
    root.querySelector('#stats').innerHTML =
      card('Membres', team.length) +
      card('Actifs', active.length) +
      card('Créneaux', shifts.length) +
      card('À venir', future.length, 'text-solar-600');
  }

  function renderPickers() {
    const emp = root.querySelector('#a-emp');
    const current = emp.value;
    emp.innerHTML = '<option value="">Choisir un membre…</option>' +
      team.filter((e) => Number(e.active))
        .map((e) => '<option value="' + e.id + '">' + $ui.esc(e.name + ' — ' + e.role) + '</option>').join('');
    emp.value = current || '';

    const kinds = ($db.fields('shifts').filter((f) => f.name === 'kind')[0] || {}).options || [];
    const kind = root.querySelector('#a-kind');
    if (!kind.options.length) {
      kind.innerHTML = kinds.map((k) => '<option value="' + $ui.esc(k) + '">' + $ui.esc(k) + '</option>').join('');
    }
    const day = root.querySelector('#a-day');
    if (!day.value) day.value = iso(new Date());
  }

  function renderLoad() {
    const monday = mondayOf(new Date());
    const from = iso(monday);
    const to = iso(addDays(monday, 6));
    root.querySelector('#week-label').textContent = 'du ' + monday.toLocaleDateString('fr-FR') +
      ' au ' + addDays(monday, 6).toLocaleDateString('fr-FR');

    const week = shifts.filter((s) => s.day >= from && s.day <= to && s.kind !== 'Congé');
    const active = team.filter((e) => Number(e.active));

    if (!active.length) {
      root.querySelector('#load').innerHTML = '<p class="text-sm text-slate-400">Aucun membre actif.</p>';
      return;
    }

    root.querySelector('#load').innerHTML = active.map((e) => {
      const hours = week.filter((s) => Number(s.employee_id) === e.id)
        .reduce((sum, s) => sum + Math.max(0, minutes(s.end_at) - minutes(s.start_at)) / 60, 0);
      const target = Number(e.weekly_hours || 35);
      const pct = target > 0 ? Math.min(140, Math.round((hours / target) * 100)) : 0;
      const tone = pct > 100 ? 'bg-rose-500' : pct >= 80 ? 'bg-emerald-500' : 'bg-solar-500';
      return '<div class="mb-3">' +
        '<div class="flex justify-between text-xs"><span class="font-medium text-slate-700">' + $ui.esc(e.name) + '</span>' +
        '<span class="' + (pct > 100 ? 'font-bold text-rose-600' : 'text-slate-500') + '">' +
        hours.toFixed(1) + ' h / ' + target + ' h</span></div>' +
        '<div class="mt-1 h-2 rounded-full bg-slate-100"><div class="h-2 rounded-full ' + tone +
        '" style="width:' + Math.min(100, pct) + '%"></div></div></div>';
    }).join('');
  }

  /* Affectation rapide */
  const assign = root.querySelector('#assign');
  const aMsg = root.querySelector('#a-msg');
  assign.onsubmit = async (ev) => {
    ev.preventDefault();
    aMsg.textContent = '';
    try {
      const created = await $db.create('shifts', {
        employee_id: Number(root.querySelector('#a-emp').value),
        day: root.querySelector('#a-day').value,
        start_at: root.querySelector('#a-start').value,
        end_at: root.querySelector('#a-end').value,
        kind: root.querySelector('#a-kind').value,
        site: root.querySelector('#a-site').value.trim()
      });
      aMsg.className = 'text-sm font-medium text-emerald-600';
      aMsg.textContent = 'Créneau #' + created.id + ' ajouté.';
      root.querySelector('#a-site').value = '';
      await shiftsCrud.refresh();
    } catch (e) {
      aMsg.className = 'text-sm font-medium text-rose-600';
      aMsg.textContent = e.message;
    }
  };

  /* Mot de passe */
  const pwForm = root.querySelector('#pw-form');
  const pwMsg = root.querySelector('#pw-msg');
  pwForm.onsubmit = async (ev) => {
    ev.preventDefault();
    try {
      await $auth.changePassword(pwForm.current.value, pwForm.password.value);
      pwForm.reset();
      pwMsg.className = 'text-sm font-medium text-emerald-600';
      pwMsg.textContent = 'Mot de passe mis à jour.';
    } catch (e) {
      pwMsg.className = 'text-sm font-medium text-rose-600';
      pwMsg.textContent = e.message;
    }
  };

  refresh().catch((e) => $ui.toast(e.message, 'error'));
</script>
